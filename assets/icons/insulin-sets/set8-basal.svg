<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- SÆT 8 BASAL — langtidsvirkende insulin-pen (lang horisontal form) -->
  <!-- Pen-krop -->
  <rect x="2" y="9" width="16" height="6" rx="3"
        fill="rgba(255,255,255,0.9)" stroke="#94A3B8" stroke-width="1.2"/>
  <!-- Insulin (lang blå streg = vedvarende dosis) -->
  <rect x="4" y="11" width="11" height="2" rx="1" fill="#3B82F6"/>
  <!-- Dosis-knap i venstre ende -->
  <rect x="2" y="10" width="2" height="4" rx="0.5" fill="#94A3B8"/>
  <!-- Kort nål -->
  <line x1="18" y1="12" x2="22" y2="12" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
</svg>

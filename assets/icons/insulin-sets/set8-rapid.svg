<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- SÆT 8 RAPID — kompakt sprøjte med bevægelses-pil under -->
  <!-- Sprøjte-cylinder (kortere) -->
  <rect x="6" y="8" width="9" height="4" rx="0.5"
        fill="rgba(255,255,255,0.9)" stroke="#94A3B8" stroke-width="1.2"/>
  <!-- Insulin-væske inde i cylinderen -->
  <rect x="7" y="9" width="5" height="2" fill="#14B8A6"/>
  <!-- Stempel -->
  <rect x="3" y="9" width="3" height="2" fill="#94A3B8"/>
  <!-- Nål -->
  <line x1="15" y1="10" x2="19" y2="10" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Bevægelses-pil under sprøjten (signalerer fart) -->
  <line x1="9" y1="17" x2="20" y2="17" stroke="#14B8A6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="20" y1="17" x2="17" y2="14.5" stroke="#14B8A6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="20" y1="17" x2="17" y2="19.5" stroke="#14B8A6" stroke-width="1.6" stroke-linecap="round"/>
</svg>

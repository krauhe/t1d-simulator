<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- VARIANT 5 — Integreret: cylinderen ER ur-skiven (rund sprøjte-cylinder) -->
  <!-- Stempel-håndtag øverst -->
  <line x1="10" y1="1.5" x2="14" y2="1.5" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Stempel-stang -->
  <line x1="12" y1="1.5" x2="12" y2="4" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Rund "cylinder" der også er ur-skive -->
  <circle cx="12" cy="12" r="8" fill="rgba(255,255,255,0.95)" stroke="#94A3B8" stroke-width="1.4"/>
  <!-- Stempel-top inde i cylinderen (grå bånd øverst) -->
  <path d="M 4.5 10 A 8 8 0 0 1 19.5 10 L 19.5 11.5 A 8 8 0 0 0 4.5 11.5 Z" fill="#94A3B8" opacity="0.35"/>
  <!-- Insulin-væske (fylder nederste del = lang varighed) -->
  <path d="M 4.5 11.5 A 8 8 0 0 0 19.5 11.5 L 19.5 18 A 8 8 0 0 1 4.5 18 Z" fill="#3B82F6" opacity="0.85"/>
  <!-- Time-markører på ur-rim -->
  <circle cx="12" cy="4.5" r="0.45" fill="#1E293B"/>
  <circle cx="19.5" cy="12" r="0.45" fill="#1E293B"/>
  <circle cx="12" cy="19.5" r="0.45" fill="#1E293B"/>
  <circle cx="4.5" cy="12" r="0.45" fill="#1E293B"/>
  <!-- Mellemliggende markører -->
  <circle cx="17.3" cy="6.7" r="0.3" fill="#1E293B"/>
  <circle cx="17.3" cy="17.3" r="0.3" fill="#1E293B"/>
  <circle cx="6.7" cy="17.3" r="0.3" fill="#1E293B"/>
  <circle cx="6.7" cy="6.7" r="0.3" fill="#1E293B"/>
  <!-- Nål nederst -->
  <line x1="12" y1="20" x2="12" y2="22.5" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
</svg>

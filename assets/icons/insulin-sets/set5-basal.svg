<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- SÆT 5 BASAL — skildpadde (langsom og stabil, Aesop) -->
  <!-- Skjold (halv-cirkel) -->
  <path d="M5 14 A 6 5 0 0 1 17 14 Z"
        fill="#3B82F6" stroke="#94A3B8" stroke-width="1" stroke-linejoin="round"/>
  <!-- Skjold-mønster (linjer der antyder skjold-segmenter) -->
  <line x1="9" y1="11" x2="9" y2="14" stroke="#1E40AF" stroke-width="0.6"/>
  <line x1="11" y1="9.5" x2="11" y2="14" stroke="#1E40AF" stroke-width="0.6"/>
  <line x1="13" y1="9.5" x2="13" y2="14" stroke="#1E40AF" stroke-width="0.6"/>
  <line x1="15" y1="11" x2="15" y2="14" stroke="#1E40AF" stroke-width="0.6"/>
  <!-- Hoved -->
  <circle cx="18.2" cy="13.5" r="1.6" fill="#3B82F6" stroke="#94A3B8" stroke-width="0.8"/>
  <circle cx="18.7" cy="13.2" r="0.3" fill="#0F172A"/>
  <!-- Fire ben -->
  <line x1="7" y1="14" x2="6.5" y2="17" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="10" y1="14" x2="9.5" y2="17" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="13" y1="14" x2="12.5" y2="17" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="16" y1="14" x2="15.5" y2="17" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
</svg>

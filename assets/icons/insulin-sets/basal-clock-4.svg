<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- VARIANT 4 — 50/50: sprøjte diagonalt øverst-venstre, ur-badge nederst-højre -->
  <!-- Diagonal sprøjte øverst-venstre (roteret ca. -30°) -->
  <g transform="rotate(-35, 7, 8)">
    <!-- Stempel-håndtag -->
    <line x1="5.5" y1="2.5" x2="8.5" y2="2.5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Stempel-stang -->
    <line x1="7" y1="2.5" x2="7" y2="5" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Cylinder -->
    <rect x="5.2" y="5" width="3.6" height="7" rx="0.4" fill="rgba(255,255,255,0.95)" stroke="#94A3B8" stroke-width="1.2"/>
    <!-- Insulin-væske -->
    <rect x="5.8" y="6.5" width="2.4" height="5" fill="#3B82F6"/>
    <!-- Nål -->
    <line x1="7" y1="12" x2="7" y2="14.5" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>
  </g>
  <!-- Ur-badge nederst-højre -->
  <circle cx="16.5" cy="16.5" r="6" fill="rgba(255,255,255,0.95)" stroke="#94A3B8" stroke-width="1.2"/>
  <!-- Time-markører -->
  <circle cx="16.5" cy="11.5" r="0.4" fill="#94A3B8"/>
  <circle cx="21.5" cy="16.5" r="0.4" fill="#94A3B8"/>
  <circle cx="16.5" cy="21.5" r="0.4" fill="#94A3B8"/>
  <circle cx="11.5" cy="16.5" r="0.4" fill="#94A3B8"/>
  <!-- Visere pegende på 24t-position (opad, symboliserer lang varighed) -->
  <line x1="16.5" y1="16.5" x2="16.5" y2="13" stroke="#3B82F6" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="16.5" y1="16.5" x2="19" y2="16.5" stroke="#3B82F6" stroke-width="0.9" stroke-linecap="round"/>
  <circle cx="16.5" cy="16.5" r="0.6" fill="#3B82F6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- SÆT 2 BASAL — timeglas (sand der løber langsomt) -->
  <!-- Top og bund-stænger -->
  <line x1="6" y1="3" x2="18" y2="3" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="6" y1="21" x2="18" y2="21" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Glas-rammen (timeglas-form) -->
  <path d="M7 3 L17 3 L13 12 L17 21 L7 21 L11 12 Z"
        fill="rgba(255,255,255,0.9)" stroke="#94A3B8" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Sand i bund (basal-blå) -->
  <path d="M9.5 17 L14.5 17 L16.5 20.5 L7.5 20.5 Z" fill="#3B82F6"/>
  <!-- Et lille drop ved skæringen i færd med at falde -->
  <circle cx="12" cy="13" r="0.8" fill="#3B82F6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- VARIANT 3 — Top/bund split: ur øverst, horisontal sprøjte nederst -->
  <!-- Ur øverst (kompakt, med visere) -->
  <circle cx="12" cy="7" r="5.5" fill="rgba(255,255,255,0.95)" stroke="#94A3B8" stroke-width="1.2"/>
  <!-- Time-markører -->
  <circle cx="12" cy="2.2" r="0.4" fill="#94A3B8"/>
  <circle cx="16.8" cy="7" r="0.4" fill="#94A3B8"/>
  <circle cx="12" cy="11.8" r="0.4" fill="#94A3B8"/>
  <circle cx="7.2" cy="7" r="0.4" fill="#94A3B8"/>
  <!-- Visere (time + minut) — tyk blå peger på "24 timer" -->
  <line x1="12" y1="7" x2="12" y2="3.5" stroke="#3B82F6" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="12" y1="7" x2="14.8" y2="7" stroke="#3B82F6" stroke-width="1" stroke-linecap="round"/>
  <circle cx="12" cy="7" r="0.6" fill="#3B82F6"/>
  <!-- Horisontal sprøjte nederst -->
  <!-- Stempel-håndtag (venstre) -->
  <line x1="2" y1="16.5" x2="2" y2="19.5" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Stempel-stang -->
  <line x1="2" y1="18" x2="4.5" y2="18" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Cylinder -->
  <rect x="4.5" y="16" width="11" height="4" rx="0.4" fill="rgba(255,255,255,0.95)" stroke="#94A3B8" stroke-width="1.2"/>
  <!-- Insulin-væske (lang blå streg) -->
  <rect x="5.5" y="17" width="9" height="2" fill="#3B82F6"/>
  <!-- Nål -->
  <line x1="15.5" y1="18" x2="19" y2="18" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
</svg>

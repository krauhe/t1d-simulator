<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- SÆT 5 RAPID — hare (hurtig og spændstigt, Aesop) -->
  <!-- Krop -->
  <ellipse cx="11" cy="14" rx="6" ry="3" fill="#14B8A6" stroke="#94A3B8" stroke-width="1"/>
  <!-- Hoved -->
  <circle cx="17" cy="12" r="2" fill="#14B8A6" stroke="#94A3B8" stroke-width="1"/>
  <!-- Lange ører -->
  <path d="M15.8 10 Q 15.5 5, 17 5 Q 17.5 8, 17 10 Z" fill="#14B8A6" stroke="#94A3B8" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M17.8 10 Q 17.8 5, 19.3 5 Q 19.5 8, 19 10 Z" fill="#14B8A6" stroke="#94A3B8" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Øje -->
  <circle cx="17.5" cy="11.5" r="0.3" fill="#0F172A"/>
  <!-- Bagben i sprint -->
  <line x1="6" y1="14" x2="3" y2="18" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9" y1="16" x2="6" y2="20" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hale -->
  <circle cx="5" cy="13" r="0.9" fill="#14B8A6"/>
  <!-- Bevægelses-streger bag haren -->
  <line x1="2" y1="11" x2="4.5" y2="11" stroke="#14B8A6" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="2.5" y1="9.5" x2="4" y2="9.5" stroke="#14B8A6" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
</svg>

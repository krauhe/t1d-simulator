<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- VARIANT 6 — Sprøjte som time-viser på ur -->
  <!-- Ur-skive (stor baggrund) -->
  <circle cx="12" cy="12" r="11" fill="rgba(255,255,255,0.95)" stroke="#94A3B8" stroke-width="1.3"/>
  <!-- Alle 12 time-markører -->
  <circle cx="12" cy="2.5" r="0.5" fill="#94A3B8"/>
  <circle cx="16.75" cy="3.77" r="0.35" fill="#94A3B8"/>
  <circle cx="20.23" cy="7.25" r="0.35" fill="#94A3B8"/>
  <circle cx="21.5" cy="12" r="0.5" fill="#94A3B8"/>
  <circle cx="20.23" cy="16.75" r="0.35" fill="#94A3B8"/>
  <circle cx="16.75" cy="20.23" r="0.35" fill="#94A3B8"/>
  <circle cx="12" cy="21.5" r="0.5" fill="#94A3B8"/>
  <circle cx="7.25" cy="20.23" r="0.35" fill="#94A3B8"/>
  <circle cx="3.77" cy="16.75" r="0.35" fill="#94A3B8"/>
  <circle cx="2.5" cy="12" r="0.5" fill="#94A3B8"/>
  <circle cx="3.77" cy="7.25" r="0.35" fill="#94A3B8"/>
  <circle cx="7.25" cy="3.77" r="0.35" fill="#94A3B8"/>
  <!-- Kort minut-viser pegende på 3 (3 timer efter injektion) -->
  <line x1="12" y1="12" x2="17" y2="12" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
  <!-- Sprøjte SOM lang time-viser pegende fra centrum opad -->
  <!-- Stempel-håndtag øverst -->
  <line x1="10.5" y1="3" x2="13.5" y2="3" stroke="#3B82F6" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Stempel-stang -->
  <line x1="12" y1="3" x2="12" y2="5" stroke="#3B82F6" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Cylinder (smal, fungerer som viser) -->
  <rect x="10.8" y="5" width="2.4" height="6.5" rx="0.3" fill="rgba(255,255,255,0.95)" stroke="#3B82F6" stroke-width="1.1"/>
  <!-- Insulin-væske -->
  <rect x="11.2" y="6" width="1.6" height="5.2" fill="#3B82F6"/>
  <!-- Centrum-prik (hvor viseren er forankret) -->
  <circle cx="12" cy="12" r="0.9" fill="#3B82F6"/>
</svg>

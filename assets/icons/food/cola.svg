<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- Generisk sodavandsglas (cola): tapered tumbler med brun væske, bobler og sugerør.
       Bevidst farve-neutralt: bobler + glasform er det universelle "sodavand"-signal,
       så ikonet læses korrekt selv hvis brun-tonen ser anderledes ud på forskellige skærme. -->

  <!-- Glas-bagside (skygge for dybde) -->
  <path d="M9 9 L11 32 L25 32 L27 9 Z" fill="rgba(255,255,255,0.08)"/>

  <!-- Væske (brun/amber, fylder ~75% af glasset) -->
  <path d="M10 14 L11.6 31 L24.4 31 L26 14 Z" fill="#8B4513" opacity="0.85"/>

  <!-- Væske-overflade (mørkere brun ellipse — signalerer cola-overflade set ovenfra ved y=14) -->
  <ellipse cx="18" cy="14" rx="8" ry="1.3" fill="#5A2D0E"/>

  <!-- Glas-kant (omrids) -->
  <path d="M9 9 L11 32 L25 32 L27 9" stroke="#CBD5E1" stroke-width="1.2" stroke-linejoin="round" fill="none"/>

  <!-- Top-åbning (tom — vi ser ned i glasset, hvor luften er over væsken; let skygge for 3D-look) -->
  <ellipse cx="18" cy="9" rx="9" ry="1.8" fill="rgba(0,0,0,0.18)" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Bobler (det universelle "sodavand"-signal) -->
  <circle cx="14.5" cy="17" r="1.1" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="20" cy="20" r="1.4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="16" cy="23" r="0.9" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="22" cy="26" r="1.2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="13.5" cy="28" r="0.8" fill="#FFFFFF" opacity="0.9"/>
</svg>

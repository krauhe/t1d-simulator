<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Førstehjælpskasse: rødt etui med hvidt kors -->
  <!-- Håndtag (mørk top-bøjle) -->
  <path d="M9.5 5.5 Q12 3.5 14.5 5.5" stroke="#3F1212" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- Hovedkasse (rød, afrundede hjørner) -->
  <rect x="3.5" y="6" width="17" height="14" rx="1.8" ry="1.8" fill="#DC2626" stroke="#7F1010" stroke-width="0.8"/>
  <!-- Hvidt kors — vandret bjælke -->
  <rect x="6.5" y="11.7" width="11" height="2.6" fill="#FFFFFF"/>
  <!-- Hvidt kors — lodret bjælke -->
  <rect x="10.7" y="7.5" width="2.6" height="11" fill="#FFFFFF"/>
</svg>

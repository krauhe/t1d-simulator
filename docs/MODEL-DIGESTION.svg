<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 880 580" style="font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#fff" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowhead markers for each color -->
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#B45309"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#047857"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#1D4ED8"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#7E22CE"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#B91C1C"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#EA580C"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- ══════════ TITLE ══════════ -->
  <text x="440" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">DIGESTION MODEL — Food Absorption Pathways</text>
  <text x="440" y="44" text-anchor="middle" font-size="11" fill="#64748B">Three parallel pathways: Carbohydrates (Hovorka D1/D2), Protein (glucagon), Fat (FFA resistance)</text>

  <!-- ══════════ FOOD INPUT (top) ══════════ -->
  <rect x="310" y="56" width="260" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="440" y="70" text-anchor="middle" font-size="10" fill="#64748B" font-weight="700" letter-spacing="2">FOOD INPUT</text>
  <text x="440" y="84" text-anchor="middle" font-size="11" fill="#334155" font-weight="600">Carbs (g) + Fat (g) + Protein (g)</text>

  <!-- Three arrows down from food input -->
  <line x1="200" y1="92" x2="200" y2="120" stroke="#B45309" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="440" y1="92" x2="440" y2="120" stroke="#047857" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="680" y1="92" x2="680" y2="120" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- Connect food input to arrows with horizontal lines -->
  <line x1="310" y1="92" x2="200" y2="92" stroke="#B45309" stroke-width="1.5"/>
  <line x1="570" y1="92" x2="680" y2="92" stroke="#EA580C" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- COLUMN 1: CARBOHYDRATES (left, amber) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="122" width="280" height="210" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
  <text x="200" y="142" text-anchor="middle" font-size="11" fill="#92400E" font-weight="700" letter-spacing="1.5">CARBOHYDRATES</text>
  <text x="200" y="157" text-anchor="middle" font-size="9.5" fill="#B45309">Hovorka 2004 gut model</text>

  <!-- D1 box -->
  <rect x="100" y="168" width="70" height="30" rx="6" fill="#fff" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="135" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">D1</text>
  <text x="180" y="180" font-size="11" fill="#92400E" font-weight="600">Stomach</text>
  <text x="180" y="194" font-size="9.5" fill="#B45309">carb pool [mmol]</text>

  <!-- Arrow D1 → D2 -->
  <line x1="135" y1="198" x2="135" y2="226" stroke="#B45309" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="152" y="218" font-size="9.5" fill="#92400E" font-style="italic">1/tau_G</text>

  <!-- D2 box -->
  <rect x="100" y="228" width="70" height="30" rx="6" fill="#fff" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="135" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">D2</text>
  <text x="180" y="240" font-size="11" fill="#92400E" font-weight="600">Small intestine</text>
  <text x="180" y="254" font-size="9.5" fill="#B45309">carb pool [mmol]</text>

  <!-- Arrow D2 → UG output -->
  <line x1="135" y1="258" x2="135" y2="296" stroke="#B45309" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="152" y="278" font-size="9.5" fill="#92400E" font-style="italic">U_G = D2/tau_G</text>

  <!-- UG output box -->
  <rect x="88" y="298" width="96" height="24" rx="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="136" y="315" text-anchor="middle" font-size="10" fill="#92400E" font-weight="700">U_G [mmol/min]</text>

  <!-- Parameters box -->
  <rect x="200" y="298" width="130" height="28" rx="5" fill="#fff" stroke="#FDE68A" stroke-width="1"/>
  <text x="210" y="312" font-size="9" fill="#92400E">tau_G = 40 min (base)</text>
  <text x="210" y="322" font-size="9" fill="#92400E">A_G = 0.8 (bioavail.)</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- COLUMN 2: PROTEIN (center, green) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="360" y="122" width="260" height="210" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
  <text x="490" y="142" text-anchor="middle" font-size="11" fill="#065F46" font-weight="700" letter-spacing="1.5">PROTEIN</text>
  <text x="490" y="157" text-anchor="middle" font-size="9.5" fill="#047857">Glucagon-driven HGP (Paterson 2016)</text>

  <!-- proteinStomach box -->
  <rect x="395" y="168" width="95" height="26" rx="6" fill="#fff" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="442" y="186" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">protStomach</text>
  <text x="500" y="182" font-size="9.5" fill="#047857">[g]</text>

  <!-- Arrow proteinStomach → proteinGut -->
  <line x1="442" y1="194" x2="442" y2="218" stroke="#047857" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <text x="460" y="211" font-size="9" fill="#047857" font-style="italic">1/tau_G</text>

  <!-- proteinGut box -->
  <rect x="395" y="220" width="95" height="26" rx="6" fill="#fff" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="442" y="238" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">protGut</text>
  <text x="500" y="234" font-size="9.5" fill="#047857">[g]</text>

  <!-- Arrow proteinGut → aminoAcidsBlood -->
  <line x1="442" y1="246" x2="442" y2="270" stroke="#047857" stroke-width="1.3" marker-end="url(#arr-green)"/>
  <text x="460" y="263" font-size="9" fill="#047857" font-style="italic">1/tau_ProtAbs</text>

  <!-- aminoAcidsBlood box -->
  <rect x="385" y="272" width="115" height="26" rx="6" fill="#fff" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="442" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">aminoAcids</text>
  <text x="510" y="286" font-size="9.5" fill="#047857">[g]</text>

  <!-- Decay arrow from aminoAcidsBlood -->
  <text x="515" y="292" font-size="8" fill="#6B7280" font-style="italic">t1/2=60min</text>

  <!-- Arrow aminoAcidsBlood → glucagon (Hill function) -->
  <line x1="442" y1="298" x2="442" y2="322" stroke="#047857" stroke-width="1.3" marker-end="url(#arr-green)"/>

  <!-- Glucagon Hill function box -->
  <rect x="380" y="300" width="140" height="28" rx="5" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
  <text x="450" y="314" text-anchor="middle" font-size="9" fill="#065F46" font-weight="600">Hill: EC50=8g, n=2</text>
  <text x="450" y="324" text-anchor="middle" font-size="9" fill="#065F46">max glucagon = 0.25</text>

  <!-- Parameters -->
  <text x="535" y="310" font-size="8.5" fill="#047857">tau_ProtAbs = 90 min</text>
  <text x="535" y="322" font-size="8.5" fill="#047857">AA_DECAY t1/2 = 60 min</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- COLUMN 3: FAT (right, orange) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="640" y="122" width="220" height="210" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="750" y="142" text-anchor="middle" font-size="11" fill="#9A3412" font-weight="700" letter-spacing="1.5">FAT</text>
  <text x="750" y="157" text-anchor="middle" font-size="9.5" fill="#EA580C">Pizza effect + FFA resistance</text>

  <!-- fatStomach box -->
  <rect x="680" y="168" width="90" height="26" rx="6" fill="#fff" stroke="#FB923C" stroke-width="1.2"/>
  <text x="725" y="186" text-anchor="middle" font-size="10" font-weight="700" fill="#9A3412">fatStomach</text>
  <text x="778" y="182" font-size="9.5" fill="#EA580C">[g]</text>

  <!-- Arrow fatStomach → fatIntestine -->
  <line x1="725" y1="194" x2="725" y2="218" stroke="#EA580C" stroke-width="1.3" marker-end="url(#arr-orange)"/>
  <text x="740" y="211" font-size="9" fill="#EA580C" font-style="italic">1/tau_G</text>

  <!-- fatIntestine box -->
  <rect x="673" y="220" width="105" height="26" rx="6" fill="#fff" stroke="#FB923C" stroke-width="1.2"/>
  <text x="725" y="238" text-anchor="middle" font-size="10" font-weight="700" fill="#9A3412">fatIntestine</text>
  <text x="785" y="234" font-size="9.5" fill="#EA580C">[g]</text>

  <!-- Arrow fatIntestine → absorbed/ffaBlood -->
  <line x1="725" y1="246" x2="725" y2="274" stroke="#EA580C" stroke-width="1.3" marker-end="url(#arr-orange)"/>
  <text x="740" y="265" font-size="9" fill="#EA580C" font-style="italic">1/tau_FatAbs</text>

  <!-- ffaBlood box -->
  <rect x="680" y="276" width="90" height="26" rx="6" fill="#fff" stroke="#FB923C" stroke-width="1.2"/>
  <text x="725" y="294" text-anchor="middle" font-size="10" font-weight="700" fill="#9A3412">ffaBlood</text>
  <text x="778" y="290" font-size="9.5" fill="#EA580C">[g]</text>

  <!-- Parameters -->
  <text x="660" y="316" font-size="8.5" fill="#EA580C">tau_FatAbs = 150 min</text>
  <text x="660" y="328" font-size="8.5" fill="#EA580C">FFA clearance t1/2 = 180 min</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- CROSS-PATHWAY INTERACTION: Fat slows gastric emptying -->
  <!-- Routed BELOW the three columns to avoid overlapping protein pathway -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Dashed arrow from fatIntestine → down below columns → left to carb column tau_G -->
  <path d="M 673,240 L 660,240 L 660,345 L 200,345 L 200,326" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-orange)"/>
  <!-- Label box positioned below columns, left of glucagon arrow (x=450) -->
  <rect x="210" y="336" width="220" height="28" rx="5" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="320" y="349" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="600">Fat slows gastric emptying</text>
  <text x="320" y="360" text-anchor="middle" font-size="8.5" fill="#EA580C" font-style="italic">tau_G = 40 + 18 * ln(1 + fatIntestine / 10)</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- BOTTOM ROW: Output targets -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Q1 Plasma Glucose (target for carbs) -->
  <rect x="80" y="370" width="200" height="60" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
  <rect x="94" y="378" width="45" height="22" rx="6" fill="#fff" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="116" y="394" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">Q1</text>
  <text x="148" y="390" font-size="11" fill="#991B1B" font-weight="600">PLASMA GLUCOSE</text>
  <text x="94" y="410" font-size="9.5" fill="#B91C1C">BG = Q1 / V_G [mmol/L]</text>
  <text x="94" y="422" font-size="9" fill="#64748B">+ U_G from carb absorption</text>

  <!-- Arrow UG → Q1 -->
  <line x1="136" y1="322" x2="136" y2="368" stroke="#B45309" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <text x="148" y="350" font-size="10" fill="#92400E" font-weight="600" font-style="italic">U_G</text>

  <!-- Liver / stressMultiplier (target for protein glucagon) -->
  <rect x="360" y="370" width="200" height="60" rx="10" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.8"/>
  <text x="460" y="388" text-anchor="middle" font-size="11" fill="#581C87" font-weight="700">LIVER — EGP</text>
  <text x="370" y="404" font-size="9.5" fill="#6D28D9">stressMult += proteinGlucagonLevel</text>
  <text x="370" y="418" font-size="9" fill="#7E22CE">EGP = EGP0 * max(0, stress - x3)</text>

  <!-- Arrow glucagon → Liver -->
  <line x1="450" y1="328" x2="450" y2="368" stroke="#047857" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="462" y="348" font-size="10" fill="#065F46" font-weight="600">glucagon</text>
  <text x="462" y="362" font-size="9" fill="#047857" font-style="italic">proteinGlucagonLevel</text>

  <!-- ISF Modifier (target for FFA resistance) -->
  <rect x="630" y="370" width="220" height="60" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="740" y="388" text-anchor="middle" font-size="11" fill="#581C87" font-weight="700">ISF MODIFIER</text>
  <text x="640" y="404" font-size="9.5" fill="#6D28D9">ffaResistanceFactor divides ISF</text>
  <text x="640" y="418" font-size="9" fill="#7E22CE">Hill: EC50=8g, n=2, max=0.42</text>

  <!-- Arrow ffaBlood → FFA resistance → ISF -->
  <line x1="725" y1="302" x2="725" y2="368" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="737" y="342" font-size="9.5" fill="#9A3412" font-weight="600">FFA resistance</text>
  <text x="737" y="356" font-size="9" fill="#EA580C" font-style="italic">Wolpert 2013</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- TIMING DIAGRAM (bottom) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="452" width="800" height="108" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="76" y="470" font-size="10.5" fill="#475569" font-weight="700" letter-spacing="1">TIMELINE — Typical Response After a Mixed Meal (30g Carbs + 20g Fat + 30g Protein)</text>

  <!-- Time axis -->
  <line x1="100" y1="530" x2="820" y2="530" stroke="#CBD5E1" stroke-width="1"/>
  <text x="100" y="548" text-anchor="middle" font-size="9" fill="#64748B">0h</text>
  <text x="220" y="548" text-anchor="middle" font-size="9" fill="#64748B">1h</text>
  <text x="340" y="548" text-anchor="middle" font-size="9" fill="#64748B">2h</text>
  <text x="460" y="548" text-anchor="middle" font-size="9" fill="#64748B">3h</text>
  <text x="580" y="548" text-anchor="middle" font-size="9" fill="#64748B">4h</text>
  <text x="700" y="548" text-anchor="middle" font-size="9" fill="#64748B">5h</text>
  <text x="820" y="548" text-anchor="middle" font-size="9" fill="#64748B">6h+</text>

  <!-- Tick marks -->
  <line x1="100" y1="528" x2="100" y2="532" stroke="#94A3B8" stroke-width="1"/>
  <line x1="220" y1="528" x2="220" y2="532" stroke="#94A3B8" stroke-width="1"/>
  <line x1="340" y1="528" x2="340" y2="532" stroke="#94A3B8" stroke-width="1"/>
  <line x1="460" y1="528" x2="460" y2="532" stroke="#94A3B8" stroke-width="1"/>
  <line x1="580" y1="528" x2="580" y2="532" stroke="#94A3B8" stroke-width="1"/>
  <line x1="700" y1="528" x2="700" y2="532" stroke="#94A3B8" stroke-width="1"/>
  <line x1="820" y1="528" x2="820" y2="532" stroke="#94A3B8" stroke-width="1"/>

  <!-- Carb curve (fast peak) -->
  <path d="M 100,525 Q 160,490 220,510 Q 340,525 400,528" stroke="#B45309" stroke-width="2" fill="none"/>
  <text x="170" y="488" font-size="9" fill="#92400E" font-weight="600">Carbs: peak ~40-60 min</text>

  <!-- Protein curve (delayed, broader) -->
  <path d="M 100,528 Q 220,526 340,500 Q 460,488 580,508 Q 700,524 820,528" stroke="#047857" stroke-width="2" fill="none"/>
  <text x="380" y="484" font-size="9" fill="#065F46" font-weight="600">Protein: peak ~2.5-3h</text>

  <!-- Fat/FFA curve (very delayed, long lasting) -->
  <path d="M 100,528 Q 280,526 460,510 Q 580,496 700,502 Q 780,510 820,516" stroke="#EA580C" stroke-width="2" fill="none"/>
  <text x="560" y="492" font-size="9" fill="#9A3412" font-weight="600">FFA resistance: peak ~5-6h</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <text x="76" y="555" font-size="8.5" fill="#94A3B8">Sources: Hovorka 2004, Paterson 2016 (protein), Smart 2013 (fat delay), Wolpert 2013 (FFA resistance), Fromentin 2013 (amino acids)</text>
</svg>

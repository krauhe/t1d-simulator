<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 880 620" style="font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#fff" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#0E7490"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#B91C1C"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#059669"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#7E22CE"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#D97706"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1L9,5L0,9" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- ══════════ TITLE ══════════ -->
  <text x="440" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">KETONE / DKA MODEL — FFA-Driven Ketogenesis</text>
  <text x="440" y="44" text-anchor="middle" font-size="11" fill="#64748B">Insulin regulates lipolysis and CPT-1 gating; clearance via Michaelis-Menten + renal excretion</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- INSULIN INPUT (top left) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="62" width="200" height="55" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.8"/>
  <rect x="74" y="70" width="42" height="22" rx="6" fill="#fff" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="95" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#155E75">I</text>
  <text x="126" y="82" font-size="11" fill="#155E75" font-weight="600">PLASMA INSULIN</text>
  <text x="74" y="105" font-size="9.5" fill="#0E7490">From Hovorka model [mU/L]</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- STEP 1: LIPOLYSIS (insulin suppresses fat breakdown) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Arrow from Insulin down to lipolysis gate -->
  <line x1="160" y1="117" x2="160" y2="150" stroke="#0E7490" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <text x="170" y="138" font-size="9" fill="#0E7490" font-weight="600">suppresses</text>

  <!-- Lipolysis Hill gate -->
  <rect x="60" y="152" width="200" height="74" rx="10" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <text x="160" y="172" text-anchor="middle" font-size="11" fill="#92400E" font-weight="700" letter-spacing="1">LIPOLYSIS</text>
  <text x="74" y="190" font-size="9.5" fill="#D97706">Adipose tissue releases FFA</text>
  <text x="74" y="204" font-size="9.5" fill="#92400E" font-weight="600">Hill suppression by insulin:</text>
  <text x="74" y="218" font-size="9" fill="#D97706" font-family="Consolas,Monaco,monospace">EC50=8 mU/L, n=3, max=0.09/min</text>

  <!-- Lipolysis rate examples (right side annotation) -->
  <rect x="280" y="152" width="190" height="74" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="290" y="168" font-size="9" fill="#92400E" font-weight="700">Lipolysis rate at insulin levels:</text>
  <text x="290" y="182" font-size="9" fill="#D97706">I = 0 mU/L:   100% (0.090/min)</text>
  <text x="290" y="194" font-size="9" fill="#D97706">I = 5 mU/L:    80% (0.072/min)</text>
  <text x="290" y="206" font-size="9" fill="#D97706">I = 9 mU/L:    41% (0.037/min)</text>
  <text x="290" y="218" font-size="9" fill="#D97706">I = 25 mU/L:    3% (0.003/min)</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- STEP 2: FFA POOL (lipolysis-derived) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Arrow lipolysis → FFA pool -->
  <line x1="160" y1="226" x2="160" y2="258" stroke="#D97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <text x="170" y="247" font-size="9" fill="#D97706" font-style="italic">FFA production</text>

  <rect x="80" y="260" width="160" height="40" rx="8" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <text x="160" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">ffaLipolysis</text>
  <text x="160" y="293" text-anchor="middle" font-size="9.5" fill="#D97706">FFA pool [arb. units]</text>

  <!-- FFA clearance annotation -->
  <text x="248" y="275" font-size="9" fill="#6B7280">clearance</text>
  <text x="248" y="287" font-size="9" fill="#6B7280" font-style="italic">t1/2 = 60 min</text>
  <line x1="240" y1="280" x2="310" y2="280" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-gray)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- STEP 3: CPT-1 GATING (insulin suppresses via malonyl-CoA) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Arrow FFA → CPT-1 gate -->
  <line x1="160" y1="300" x2="160" y2="332" stroke="#D97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>

  <rect x="60" y="334" width="200" height="68" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="160" y="354" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="700" letter-spacing="1">CPT-1 GATE</text>
  <text x="74" y="370" font-size="9.5" fill="#B91C1C">FFA entry to mitochondria</text>
  <text x="74" y="384" font-size="9.5" fill="#991B1B" font-weight="600">Hill suppression by insulin:</text>
  <text x="74" y="396" font-size="9" fill="#B91C1C" font-family="Consolas,Monaco,monospace">EC50=8 mU/L, n=4, max_supp=0.95</text>

  <!-- Insulin also suppresses CPT-1 (second arrow from top) -->
  <path d="M 60,89 L 42,89 L 42,368 L 58,368" stroke="#0E7490" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-teal)"/>
  <text x="32" y="250" font-size="9" fill="#0E7490" font-weight="600" transform="rotate(-90,32,250)">insulin suppresses CPT-1</text>

  <!-- CPT-1 activity annotation -->
  <rect x="280" y="334" width="190" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="290" y="350" font-size="9" fill="#991B1B" font-weight="700">CPT-1 activity at insulin levels:</text>
  <text x="290" y="364" font-size="9" fill="#B91C1C">I = 0 mU/L:  100% (wide open)</text>
  <text x="290" y="376" font-size="9" fill="#B91C1C">I = 8 mU/L:   52% (half blocked)</text>
  <text x="290" y="388" font-size="9" fill="#B91C1C">I = 15 mU/L:   9% (nearly closed)</text>
  <text x="290" y="400" font-size="9" fill="#B91C1C">I = 25 mU/L:   5% (minimum residual)</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- STEP 4: BHB PRODUCTION -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Arrow CPT-1 → BHB -->
  <line x1="160" y1="402" x2="160" y2="434" stroke="#B91C1C" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="172" y="422" font-size="9" fill="#991B1B" font-style="italic">beta-oxidation</text>

  <!-- BHB main box -->
  <rect x="60" y="436" width="200" height="62" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
  <rect x="74" y="444" width="55" height="24" rx="6" fill="#fff" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="101" y="461" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">BHB</text>
  <text x="140" y="454" font-size="11" fill="#991B1B" font-weight="600">ketoneLevel</text>
  <text x="140" y="470" font-size="9.5" fill="#B91C1C">[mmol/L]</text>
  <text x="74" y="486" font-size="8.5" fill="#991B1B">prod = BHB_PROD_RATE × ffa × cpt1</text>
  <text x="74" y="496" font-size="8" fill="#64748B" font-style="italic">BHB_PROD_RATE = 0.003 /min</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- CLEARANCE PATHWAYS (right side) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Arrow BHB → MM clearance -->
  <line x1="260" y1="460" x2="340" y2="460" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- Michaelis-Menten clearance box -->
  <rect x="342" y="436" width="210" height="62" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="447" y="456" text-anchor="middle" font-size="11" fill="#065F46" font-weight="700" letter-spacing="1">TISSUE CLEARANCE</text>
  <text x="356" y="472" font-size="9.5" fill="#047857">Michaelis-Menten oxidation</text>
  <text x="356" y="486" font-size="9" fill="#059669" font-family="Consolas,Monaco,monospace">Vmax=0.02, Km=2.0 mmol/L</text>
  <text x="356" y="494" font-size="9" fill="#047857">Muscles + brain burn ketones</text>

  <!-- Exercise boost annotation -->
  <rect x="560" y="436" width="156" height="62" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="570" y="452" font-size="9" fill="#065F46" font-weight="700">Exercise boost:</text>
  <text x="570" y="466" font-size="9" fill="#059669">HR 60 (rest): 1.0x Vmax</text>
  <text x="570" y="478" font-size="9" fill="#059669">HR 120:       1.5x Vmax</text>
  <text x="570" y="490" font-size="9" fill="#059669">HR 150:       1.75x Vmax</text>

  <!-- Arrow BHB → Renal clearance -->
  <path d="M 200,498 L 200,520 L 447,520" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>

  <!-- Renal clearance box -->
  <rect x="342" y="508" width="210" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
  <text x="447" y="524" text-anchor="middle" font-size="11" fill="#065F46" font-weight="700">RENAL EXCRETION</text>
  <text x="356" y="540" font-size="9" fill="#059669" font-family="Consolas,Monaco,monospace">Vmax=0.005, Km=2.0, thr=0.5</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- ACIDOSIS MODEL (bottom) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Arrow BHB → Acidosis -->
  <path d="M 100,498 L 100,520 L 100,558" stroke="#B91C1C" stroke-width="1.8" fill="none" marker-end="url(#arr-red)"/>
  <text x="108" y="540" font-size="9" fill="#991B1B" font-weight="600">BHB > 3.0</text>

  <rect x="28" y="560" width="264" height="46" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="160" y="578" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="700" letter-spacing="1">ACIDOSIS LOAD</text>
  <text x="42" y="592" font-size="8.5" fill="#B91C1C">rate = 0.3*(BHB-3) + 0.05*(BHB-3)²</text>
  <text x="42" y="602" font-size="8" fill="#64748B">threshold=1800, recovery t½=45 min</text>

  <!-- Game over annotation -->
  <rect x="302" y="562" width="110" height="40" rx="6" fill="#991B1B" stroke="#7F1D1D" stroke-width="1"/>
  <text x="357" y="578" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">GAME OVER</text>
  <text x="357" y="594" text-anchor="middle" font-size="9" fill="#FCA5A5">acidosisLoad = 100%</text>
  <line x1="292" y1="580" x2="300" y2="580" stroke="#B91C1C" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Warning annotation -->
  <rect x="302" y="560" width="110" height="0" rx="0" fill="none" stroke="none"/>
  <text x="420" y="578" font-size="9" fill="#D97706" font-weight="600">Warning at 50%</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- CLINICAL THRESHOLDS (right side panel) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="600" y="62" width="260" height="134" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="730" y="82" text-anchor="middle" font-size="11" fill="#475569" font-weight="700" letter-spacing="1">CLINICAL THRESHOLDS</text>

  <!-- Color bars for threshold ranges -->
  <rect x="616" y="92" width="228" height="20" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="0.5"/>
  <text x="624" y="106" font-size="10" fill="#065F46" font-weight="600">Normal</text>
  <text x="790" y="106" font-size="10" fill="#065F46" font-weight="600" text-anchor="end">&lt; 0.6 mmol/L</text>

  <rect x="616" y="114" width="228" height="20" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.5"/>
  <text x="624" y="128" font-size="10" fill="#92400E" font-weight="600">Elevated</text>
  <text x="790" y="128" font-size="10" fill="#92400E" font-weight="600" text-anchor="end">0.6 - 1.5 mmol/L</text>

  <rect x="616" y="136" width="228" height="20" rx="4" fill="#FED7AA" stroke="#FDBA74" stroke-width="0.5"/>
  <text x="624" y="150" font-size="10" fill="#9A3412" font-weight="600">Dangerous</text>
  <text x="790" y="150" font-size="10" fill="#9A3412" font-weight="600" text-anchor="end">1.5 - 3.0 mmol/L</text>

  <rect x="616" y="158" width="228" height="20" rx="4" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="0.5"/>
  <text x="624" y="172" font-size="10" fill="#991B1B" font-weight="600">DKA</text>
  <text x="790" y="172" font-size="10" fill="#991B1B" font-weight="600" text-anchor="end">&gt; 3.0 mmol/L</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- TYPICAL SCENARIOS (right side panel) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="600" y="208" width="260" height="106" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="730" y="228" text-anchor="middle" font-size="11" fill="#475569" font-weight="700" letter-spacing="1">TYPICAL SCENARIOS</text>

  <text x="616" y="248" font-size="9.5" fill="#334155">Normal (I=20 mU/L):</text>
  <text x="790" y="248" font-size="9.5" fill="#065F46" font-weight="600" text-anchor="end">BHB ~0.1</text>

  <text x="616" y="264" font-size="9.5" fill="#334155">Overnight fast (I=12):</text>
  <text x="790" y="264" font-size="9.5" fill="#92400E" font-weight="600" text-anchor="end">BHB ~0.3-0.5</text>

  <text x="616" y="280" font-size="9.5" fill="#334155">Pump failure 4h (I=0):</text>
  <text x="790" y="280" font-size="9.5" fill="#9A3412" font-weight="600" text-anchor="end">BHB ~1.5-2.0</text>

  <text x="616" y="296" font-size="9.5" fill="#334155">Pump failure 8h (I=0):</text>
  <text x="790" y="296" font-size="9.5" fill="#991B1B" font-weight="600" text-anchor="end">BHB ~3.5-4.5 (DKA)</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LEGEND (bottom right) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="500" y="556" width="366" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="516" y="572" font-size="9" fill="#475569" font-weight="700">LEGEND</text>
  <line x1="516" y1="582" x2="545" y2="582" stroke="#0E7490" stroke-width="1.5"/>
  <text x="550" y="586" font-size="9" fill="#475569">Insulin (suppressor)</text>
  <line x1="640" y1="582" x2="669" y2="582" stroke="#D97706" stroke-width="1.5"/>
  <text x="674" y="586" font-size="9" fill="#475569">FFA / lipolysis</text>
  <line x1="750" y1="582" x2="779" y2="582" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="784" y="586" font-size="9" fill="#475569">Ketones / danger</text>
  <line x1="516" y1="596" x2="545" y2="596" stroke="#059669" stroke-width="1.5"/>
  <text x="550" y="600" font-size="9" fill="#475569">Clearance</text>
  <text x="640" y="600" font-size="8.5" fill="#94A3B8">Sources: Pinnaro 2021, Laffel 1999, Cahill 1970, McGarry 1980</text>
</svg>
